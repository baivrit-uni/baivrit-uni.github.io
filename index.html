<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="description" content="חוברת ההיכרות של בעברית · תיכון אוניברסיטאי לשנת תשפ״ח">
<title>חוברת היכרות בעברית</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Hebrew:wdth,wght@87.5,300;87.5,400;87.5,800;87.5,900&display=swap" rel="stylesheet">
<style>
/* layout: one quiet band of school chrome above an open booklet, controls under it */
:root{
  --bg:#E8F1F2; --surface:#FFFDFA; --ink:#255F56; --soft:#28461F; --teal:#309AB7; --burg:#7F1322; --line:#ADCEC8; --shadow:rgba(37,95,86,.22);
  --font:'Noto Sans Hebrew','Arial Hebrew','Segoe UI',Arial,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--bg:#13302C;--surface:#1B3D38;--ink:#CFE1CA;--soft:#ADCEC8;--teal:#6FC3DA;--burg:#E3A9B3;--line:#2E5A53;--shadow:rgba(0,0,0,.5);color-scheme:dark}}
:root[data-theme="dark"]{--bg:#13302C;--surface:#1B3D38;--ink:#CFE1CA;--soft:#ADCEC8;--teal:#6FC3DA;--burg:#E3A9B3;--line:#2E5A53;--shadow:rgba(0,0,0,.5);color-scheme:dark}
html,body{height:100%;overflow-x:hidden}
body{background:var(--bg);color:var(--soft);font-family:var(--font);font-stretch:87.5%;margin:0;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  display:flex;flex-direction:column;align-items:center;overflow-x:hidden}
header{width:100%;max-width:1100px;display:flex;align-items:baseline;justify-content:space-between;gap:12px;flex-wrap:wrap;padding-block:14px 10px;border-bottom:3px solid var(--teal)}
h1{margin:0;font-size:clamp(20px,3.2vw,30px);line-height:1.1;color:var(--ink);font-weight:300;text-wrap:balance}
h1 b{font-weight:900}
header p{margin:0;font-size:15px;font-weight:800;color:var(--burg)}
main{flex:1;width:100%;display:flex;align-items:center;justify-content:center;padding-block:16px;min-height:0;overflow:hidden}
#stage{max-width:100%;display:flex;justify-content:center}
#stage.ready{transition:transform .6s ease}
#book{filter:drop-shadow(0 10px 22px var(--shadow))}
#book .page{background:#fff}
#book .page img{width:100%;height:100%;display:block;object-fit:cover;user-select:none;-webkit-user-drag:none}
.controls{display:flex;align-items:center;justify-content:center;gap:10px;padding-block:6px 18px;flex-wrap:wrap}
button,select{font:inherit;font-stretch:87.5%;font-weight:800;font-size:16px;border-radius:999px;cursor:pointer}
button{background:var(--ink);color:var(--bg);border:0;padding:9px 18px;min-width:96px}
button:disabled{opacity:.35;cursor:default}
button:focus-visible,select:focus-visible{outline:3px solid var(--teal);outline-offset:3px}
select{background:var(--surface);color:var(--ink);border:2px solid var(--line);padding:7px 14px;max-width:62vw}
.hint{font-size:13px;color:var(--soft);opacity:.8;text-align:center;margin:0 0 10px}
@media (prefers-reduced-motion: reduce){#book{filter:none}#stage{transition:none}}
@media (max-width:520px){.controls select{max-width:100%;order:-1;flex-basis:100%}.controls button{flex:1}}
#zoombtn{background:var(--teal)}
#zoom{position:fixed;inset:0;z-index:20;background:var(--bg);display:flex;flex-direction:column;
  padding:env(safe-area-inset-top,0px) env(safe-area-inset-right,0px) env(safe-area-inset-bottom,0px) env(safe-area-inset-left,0px)}
#zoom .bar{display:flex;align-items:center;gap:8px;padding:8px max(12px,env(safe-area-inset-right,0px)) 8px max(12px,env(safe-area-inset-left,0px));border-bottom:3px solid var(--teal)}
#zoom .bar button{min-width:44px;padding:8px 14px}
#zoom .bar .lbl{flex:1;min-width:0;font-weight:800;color:var(--ink);font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#zscroll{flex:1;overflow:auto;touch-action:pan-x pan-y;-webkit-overflow-scrolling:touch;background:var(--bg)}
#zoom[hidden]{display:none}
#zimg{display:block;max-width:none;margin:0 auto;user-select:none;-webkit-user-drag:none}
#zoom .zhint{margin:0;padding:6px 12px 10px;text-align:center;font-size:13px;color:var(--soft)}
</style>
</head>
<body>

<header>
  <h1>חוברת היכרות <b>תשפ״ח</b> · 2027/28</h1>
  <p>בעברית · תיכון אוניברסיטאי</p>
</header>

<main>
  <div id="stage"><div id="book" aria-label="חוברת היכרות, 16 עמודים"></div></div>
</main>

<div class="controls">
  <button id="prev" type="button" aria-label="לעמוד הקודם">→ הקודם</button>
  <select id="jump" aria-label="מעבר לעמוד"></select>
  <button id="next" type="button" aria-label="לעמוד הבא">הבא ←</button>
  <button id="zoombtn" type="button">הגדלת עמוד</button>
</div>
<p class="hint">מדפדפים בגרירת פינת הדף, בהחלקה או בחיצי המקלדת. כדי לקרוא מקרוב: ״הגדלת עמוד״ או צביטה בשתי אצבעות</p>

<div id="zoom" hidden role="dialog" aria-modal="true" aria-label="עמוד מוגדל">
  <div class="bar">
    <button id="zclose" type="button" aria-label="סגירת ההגדלה">✕</button>
    <span class="lbl" id="zlbl"></span>
    <button id="zout" type="button" aria-label="הקטנה">−</button>
    <button id="zin" type="button" aria-label="הגדלה">+</button>
  </div>
  <div id="zscroll" dir="ltr"><img id="zimg" alt=""></div>
  <div class="bar">
    <button id="zprev" type="button">→ הקודם</button>
    <span class="lbl"></span>
    <button id="znext" type="button">הבא ←</button>
  </div>
  <p class="zhint">צביטה או לחיצה כפולה כדי להגדיל, גרירה כדי לזוז בעמוד</p>
</div>

<script src="https://cdn.jsdelivr.net/npm/page-flip@2.0.7/dist/js/page-flip.browser.js"></script>
<script>
(function(){
  var N=16, W=595, H=842;
  var names=['שער','דבר המנהלים','תוכן עניינים ותודות','לקראת כיתה ז׳','איך לומדים אצלנו?','ללמוד בקצב שמתאים לי','מענה לפרט','יש לכם שאלות? בואו נדבר!','חוקרים צעירים','אוריינות מדעית וחינוך דיגיטלי','יום בקמפוס','תוכניות המרחב השלם','גם ההייטק אצלנו בעברית','ספורט וגלישה','הכשרה למורים','איך מגיעים?'];
  var book=document.getElementById('book'), stage=document.getElementById('stage');
  // the library reads left to right, so the pages go in reversed and the book opens on its last sheet
  for(var k=N;k>=1;k--){
    var d=document.createElement('div'); d.className='page';
    if(k===1||k===N) d.setAttribute('data-density','hard');
    var im=document.createElement('img'); im.src='pages/p'+(k<10?'0':'')+k+'.jpg'; im.alt='עמוד '+k+': '+names[k-1]; im.draggable=false;
    d.appendChild(im); book.appendChild(d);
  }
  var sel=document.getElementById('jump');
  names.forEach(function(n,i){var o=document.createElement('option');o.value=i+1;o.textContent=(i+1)+' · '+n;sel.appendChild(o);});

  function fit(){
    var wide=window.innerWidth>=760, hAvail=window.innerHeight-(wide?170:210);
    var avail=Math.min(1100,document.body.clientWidth-32);
    var pw=Math.max(150,Math.min(hAvail*W/H,avail/(wide?2:1)));
    stage.style.width=Math.floor(pw*(wide?2:1))+'px';
    return wide;
  }
  var wide=fit();
  var pf=new St.PageFlip(book,{width:W,height:H,size:'stretch',minWidth:300,maxWidth:W*1.6,minHeight:425,maxHeight:H*1.6,
    showCover:true,usePortrait:!wide||window.innerWidth<760,startPage:N-1,drawShadow:true,maxShadowOpacity:.35,mobileScrollSupport:true,flippingTime:700});
  pf.loadFromHTML(book.querySelectorAll('.page'));

  var prev=document.getElementById('prev'), next=document.getElementById('next');
  // the select shows the lowest page number on screen (the right-hand page of a spread)
  function sync(idx){
    if(typeof idx!=='number') idx=pf.getCurrentPageIndex();
    var p=N-idx, land=pf.getOrientation()==='landscape';
    if(land&&idx>0&&idx<N-1&&(p%2)===1) p-=1;
    sel.value=String(p);
    // a closed book sits on one half of the spread, so slide it to the middle
    stage.style.transform=!land?'none':idx===N-1?'translateX(25%)':idx===0?'translateX(-25%)':'none';
    prev.disabled=p<=1; next.disabled=idx<=0;
  }
  function fwd(){pf.flipPrev('top');}
  function back(){pf.flipNext('top');}
  next.addEventListener('click',fwd); prev.addEventListener('click',back);
  sel.addEventListener('change',function(){pf.flip(N-Number(sel.value),'top');});
  document.addEventListener('keydown',function(e){
    if(e.target===sel) return;
    if(e.key==='ArrowLeft'){e.preventDefault();fwd();} else if(e.key==='ArrowRight'){e.preventDefault();back();}
  });
  pf.on('flip',function(e){sync(e.data);}); pf.on('changeOrientation',function(){sync();}); pf.on('init',function(){sync();});
  sync(); setTimeout(function(){sync();},50); setTimeout(function(){stage.classList.add('ready');},400);
  var t; window.addEventListener('resize',function(){clearTimeout(t);t=setTimeout(fit,120);});

  // reading view: one page at a time, zoomed with pinch, double tap or the +/− buttons
  var zoom=document.getElementById('zoom'), zs=document.getElementById('zscroll'), zi=document.getElementById('zimg'), zl=document.getElementById('zlbl');
  var zp=1, z=1, ZMAX=4;
  function zsrc(k){return 'pages/p'+(k<10?'0':'')+k+'.jpg';}
  function setZ(nz,mx,my){
    nz=Math.max(1,Math.min(ZMAX,nz));
    var r=zs.getBoundingClientRect(); if(mx==null){mx=r.width/2;my=r.height/2;}
    var w0=zi.offsetWidth||1, cx=(zs.scrollLeft+mx)/w0, cy=(zs.scrollTop+my)/(zi.offsetHeight||1);
    z=nz; zi.style.width=Math.round(baseW()*z)+'px';
    zs.scrollLeft=cx*zi.offsetWidth-mx; zs.scrollTop=cy*zi.offsetHeight-my;
  }
  // at 1x the page fills the width of the phone (and stays a readable size on a computer)
  function baseW(){return Math.min(zs.clientWidth,900);}
  function showZ(k){
    zp=Math.max(1,Math.min(N,k)); zi.src=zsrc(zp); zi.alt='עמוד '+zp+': '+names[zp-1];
    zl.textContent=zp+' · '+names[zp-1];
    document.getElementById('zprev').disabled=zp<=1; document.getElementById('znext').disabled=zp>=N;
    z=1; zi.style.width=Math.round(baseW())+'px'; zs.scrollTop=0; zs.scrollLeft=0;
  }
  function openZ(k){zoom.hidden=false; document.body.style.overflow='hidden'; showZ(k||Number(sel.value)||1); document.getElementById('zclose').focus();}
  function closeZ(){
    zoom.hidden=true; document.body.style.overflow='';
    var target=N-zp; if(target!==pf.getCurrentPageIndex()) pf.turnToPage(target); sync(target);
    document.getElementById('zoombtn').focus();
  }
  document.getElementById('zoombtn').addEventListener('click',function(){openZ();});
  document.getElementById('zclose').addEventListener('click',closeZ);
  document.getElementById('zin').addEventListener('click',function(){setZ(z*1.5);});
  document.getElementById('zout').addEventListener('click',function(){setZ(z/1.5);});
  document.getElementById('zprev').addEventListener('click',function(){showZ(zp-1);});
  document.getElementById('znext').addEventListener('click',function(){showZ(zp+1);});
  document.addEventListener('keydown',function(e){
    if(zoom.hidden) return;
    e.stopImmediatePropagation();
    if(e.key==='Escape') closeZ(); else if(e.key==='ArrowLeft') showZ(zp+1); else if(e.key==='ArrowRight') showZ(zp-1);
    else if(e.key==='+'||e.key==='=') setZ(z*1.5); else if(e.key==='-') setZ(z/1.5);
  },true);
  var pin=null, lastTap=0;
  function dist(a,b){return Math.hypot(a.clientX-b.clientX,a.clientY-b.clientY);}
  zs.addEventListener('touchstart',function(e){
    if(e.touches.length===2){var r=zs.getBoundingClientRect();pin={d:dist(e.touches[0],e.touches[1]),z:z,mx:(e.touches[0].clientX+e.touches[1].clientX)/2-r.left,my:(e.touches[0].clientY+e.touches[1].clientY)/2-r.top};e.preventDefault();}
    else if(e.touches.length===1){var now=Date.now();
      if(now-lastTap<300){var r2=zs.getBoundingClientRect();setZ(z>1.2?1:2.5,e.touches[0].clientX-r2.left,e.touches[0].clientY-r2.top);e.preventDefault();lastTap=0;} else lastTap=now;}
  },{passive:false});
  zs.addEventListener('touchmove',function(e){if(pin&&e.touches.length===2){e.preventDefault();setZ(pin.z*dist(e.touches[0],e.touches[1])/pin.d,pin.mx,pin.my);}},{passive:false});
  zs.addEventListener('touchend',function(e){if(e.touches.length<2)pin=null;});
  zs.addEventListener('dblclick',function(e){var r=zs.getBoundingClientRect();setZ(z>1.2?1:2.5,e.clientX-r.left,e.clientY-r.top);});
  zs.addEventListener('wheel',function(e){if(e.ctrlKey){e.preventDefault();var r=zs.getBoundingClientRect();setZ(z*(e.deltaY<0?1.15:1/1.15),e.clientX-r.left,e.clientY-r.top);}},{passive:false});
  window.addEventListener('resize',function(){if(!zoom.hidden)setZ(z);});
  // a two-finger pinch on the book opens the reading view instead of turning the page
  stage.addEventListener('touchstart',function(e){
    if(e.touches.length>1){e.stopPropagation();e.preventDefault();openZ();}
  },{capture:true,passive:false});
})();
</script>
</body>
</html>
